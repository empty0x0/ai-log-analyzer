# =============================================================================
# AI Log Analysis Platform - Envoy AI Gateway Configuration
# =============================================================================
# Routes:
#   /api/deepseek/* → DeepSeek API (api.deepseek.com)
#   /api/qwen/*     → Qwen API (dashscope.aliyuncs.com)
#   /api/vertex/*   → Vertex AI (us-east5-aiplatform.googleapis.com)
# =============================================================================

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    - name: ai_gateway_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ai_gateway
                codec_type: AUTO
                route_config:
                  name: ai_routes
                  virtual_hosts:
                    - name: ai_backend
                      domains: ["*"]
                      routes:
                        # -----------------------------------------------------
                        # DeepSeek Route
                        # -----------------------------------------------------
                        - match:
                            prefix: "/api/deepseek/"
                          route:
                            cluster: deepseek_cluster
                            prefix_rewrite: "/v1/"
                            timeout: 120s
                          request_headers_to_add:
                            - header:
                                key: "Authorization"
                                value: "Bearer %DEEPSEEK_API_KEY%"
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          request_headers_to_remove:
                            - "x-api-key"

                        # -----------------------------------------------------
                        # Qwen Route
                        # -----------------------------------------------------
                        - match:
                            prefix: "/api/qwen/"
                          route:
                            cluster: qwen_cluster
                            prefix_rewrite: "/compatible-mode/v1/"
                            timeout: 120s
                          request_headers_to_add:
                            - header:
                                key: "Authorization"
                                value: "Bearer %QWEN_API_KEY%"
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          request_headers_to_remove:
                            - "x-api-key"

                        # -----------------------------------------------------
                        # Vertex AI Route (Claude)
                        # Note: Token injected by token-refresh sidecar
                        # -----------------------------------------------------
                        - match:
                            prefix: "/api/vertex/"
                          route:
                            cluster: vertex_cluster
                            regex_rewrite:
                              pattern:
                                google_re2: {}
                                regex: "^/api/vertex/(.*)"
                              substitution: "/v1/projects/%GCP_PROJECT_ID%/locations/%GCP_REGION%/publishers/anthropic/models/\\1"
                            timeout: 120s
                          request_headers_to_remove:
                            - "x-api-key"

                        # -----------------------------------------------------
                        # Health Check
                        # -----------------------------------------------------
                        - match:
                            path: "/health"
                          direct_response:
                            status: 200
                            body:
                              inline_string: '{"status":"ok"}'

                http_filters:
                  # Lua filter for Vertex AI token injection (reads from shared file)
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      default_source_code:
                        inline_string: |
                          function envoy_on_request(request_handle)
                            local path = request_handle:headers():get(":path")
                            if path and string.find(path, "^/api/vertex/") then
                              -- Read token from file (written by token-refresh sidecar)
                              local token_file = io.open("/var/run/secrets/gcp-token", "r")
                              if token_file then
                                local token = token_file:read("*all")
                                token_file:close()
                                if token and #token > 0 then
                                  request_handle:headers():add("Authorization", "Bearer " .. token:gsub("%s+", ""))
                                end
                              end
                            end
                          end
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # -------------------------------------------------------------------------
    # DeepSeek Cluster
    # -------------------------------------------------------------------------
    - name: deepseek_cluster
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      connect_timeout: 10s
      load_assignment:
        cluster_name: deepseek_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: api.deepseek.com
                      port_value: 443
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: api.deepseek.com
          common_tls_context:
            validation_context:
              trusted_ca:
                filename: /etc/ssl/certs/ca-certificates.crt

    # -------------------------------------------------------------------------
    # Qwen Cluster (Alibaba DashScope)
    # -------------------------------------------------------------------------
    - name: qwen_cluster
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      connect_timeout: 10s
      load_assignment:
        cluster_name: qwen_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: dashscope.aliyuncs.com
                      port_value: 443
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: dashscope.aliyuncs.com
          common_tls_context:
            validation_context:
              trusted_ca:
                filename: /etc/ssl/certs/ca-certificates.crt

    # -------------------------------------------------------------------------
    # Vertex AI Cluster (GCP)
    # -------------------------------------------------------------------------
    - name: vertex_cluster
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      connect_timeout: 10s
      load_assignment:
        cluster_name: vertex_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: us-east5-aiplatform.googleapis.com
                      port_value: 443
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: us-east5-aiplatform.googleapis.com
          common_tls_context:
            validation_context:
              trusted_ca:
                filename: /etc/ssl/certs/ca-certificates.crt
